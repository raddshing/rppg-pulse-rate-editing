BASE:
- ''
TOOLBOX_MODE: train_and_test
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 10
  LR: 1e-3
  MODEL_FILE_NAME: PURE_FactorizePhys_FSAM_Res
  PLOT_LOSSES_AND_LR: true
  DATA:
    FS: 30
    DATASET: PURE
    DO_PREPROCESS: false
    DATA_FORMAT: NCDHW
    DATA_PATH: <RAW_ROOT>/PURE
    CACHED_PATH: <BULK_ROOT>/st30g/FPm/original
    EXP_DATA_NAME: ''
    BEGIN: 0.0
    END: 0.8
    PREPROCESS:
      DATA_TYPE:
      - Raw
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: HC
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: false
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 72
        W: 72
VALID:
  DATA:
    FS: 30
    DATASET: PURE
    DO_PREPROCESS: false
    DATA_FORMAT: NCDHW
    DATA_PATH: <UPSTREAM_TEMPLATE_DATA_ROOT>/raw/PURE_Dataset/raw
    CACHED_PATH: <UPSTREAM_TEMPLATE_DATA_ROOT>/prep/PURE_Dataset
    EXP_DATA_NAME: ''
    BEGIN: 0.8
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Raw
      DATA_AUG:
      - None
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      RESIZE:
        H: 72
        W: 72
TEST:
  METRICS:
  - MAE
  - RMSE
  - MAPE
  - MACC
  - Pearson
  - SNR
  - BA
  USE_LAST_EPOCH: true
  DATA:
    FS: 30
    DATASET: iBVP
    DO_PREPROCESS: false
    DATA_FORMAT: NCDHW
    DATA_PATH: <UPSTREAM_TEMPLATE_DATA_ROOT>/raw/iBVP_Dataset
    CACHED_PATH: <UPSTREAM_TEMPLATE_DATA_ROOT>/prep/iBVP_Dataset
    EXP_DATA_NAME: ''
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE:
      - Raw
      LABEL_TYPE: Standardized
      DO_CHUNK: true
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: true
        BACKEND: Y5F
        USE_LARGE_FACE_BOX: true
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: true
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: false
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 72
        W: 72
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.1
  NAME: FactorizePhys
  FactorizePhys:
    CHANNELS: 3
    FRAME_NUM: 160
    MD_FSAM: true
    MD_TYPE: NMF
    MD_R: 1
    MD_S: 1
    MD_STEPS: 3
    MD_RESIDUAL: true
    MD_INFERENCE: true
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: false
    WINDOW_SIZE: 30
  MODEL_PATH: ''
